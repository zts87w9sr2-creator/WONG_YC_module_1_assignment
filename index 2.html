symbol","Open space outside Mok Hing Choi’s home, Tai Wai Hang","Roadside Worship Opposite Mok Hing Choi’s Home"]},"descriptionsEN":["In January 1992, a broad open forecourt lay before the building, with trees and hills behind. The low tiled roof and surrounding shade preserve a view of the village worship setting at the time.","The wooden doors are open as a person enters, framed by red paper couplets. Flowers and an incense burner connect worship with everyday movement through the doorway.","Door guardians are painted on the red doors, with couplets expressing wishes for protection and blessings. The course record mentions worshippers giving thanks inside at the time.","Bare ground extends to the doorway, with trees on both sides of the roof. The relatively open surroundings provided space for residents to pause and gather.","Trunks and branches frame the wall, with ventilation openings beneath the eaves. Shade and open ground behind the building form part of its everyday surroundings.","A white gable and tiled roof appear beyond open ground beside a large tree. The oblique angle reveals the depth of the building and its distance from the vegetation.","Offerings stand before a shrine surrounded by red inscriptions and decoration. Wall, shrine and altar together form the interior worship space.","An incense burner, candle holders and offerings fill the table, with figures and red hangings behind. The layered furnishings form a setting for incense offerings and worship.","A red altar table stands near the shrine among several groups of ritual furnishings. Wall inscriptions and offerings bring different devotional elements into the same room.","Several altar tables run along the wall, with figures, incense burners and inscriptions between them. The wider view records the arrangement of ritual objects indoors.","Between December 1991 and January 1992, a student played on the grass, facing the camera with arms outstretched. Water and hills appear behind, possibly Chek Lap Kok.","Between December 1991 and January 1992, three students played in open ground during a relaxed break from fieldwork. The distant hillside may be in the Ngau Au area.","A small red shrine is recessed near the foot of a wall, placing worship beside an everyday route. In folk belief, the earth deity guards the locality and receives prayers for household safety.","A person poses before a railing, with hills and open sky behind. The paved ground and railing form an outdoor space where monastery visitors could pause.","Columns, windows and eaves form an orderly frontage with open ground before the entrance. The hall houses Buddhist images and provides space for worship and religious activities.","A white tablet and incense burner stand beside the wall, dedicated to unclaimed spirits throughout the ten directions. This provision of offerings expresses care for spirits without regular worshippers.","Vases, an incense burner and offerings stand before the central seated Buddha, with smaller figures around it. The main image and altar form the focus for worship.","Gold lettering on dark stone records the monastery’s founding history. Such inscriptions preserve written memories of temple building and local religious life.","Several figures and incense burners share a table against a plain interior wall. The course record uses the local name 媽娘 for Tin Hau, preserving a local way of naming the deity.","An upright pillar in grass beneath the trees bears the words “Namo Amitabha Buddha”. The course record calls it a shigandang, a type of stone associated with protection and warding off harm in folk belief.","Smaller figures flank the central image, with an incense burner and offerings in front. The course record mentions relocation from elsewhere, showing worship continuing during a period of movement.","Figures stand before a blue wall beneath and between calligraphic inscriptions. The arrangement brings religious offerings together with inscriptions celebrating the venue’s opening.","The central figure wears colourful robes, surrounded by smaller figures and closely packed incense sticks. The incense burner and offerings preserve a scene of worship at the time.","Low walls, windows and surrounding trees present a simple exterior. The course record describes a disused church near Wong Nai Uk.","A row of windows extends along the low wall beside grass and shade. The 1992 view records the relationship between the back of the building and the surrounding village vegetation.","Fencing and open ground stand before a low building backed by a hillside. It opened as a clinic in 1971, later became a kindergarten and subsequently became Our Lady of Visitation Chapel.","Columns and vegetation create a shaded approach linking the interior with the garden. The entrance route connects the educational setting with its outdoor surroundings.","A white statue of the Virgin Mary stands in a small shrine among green plants. The garden image connects religious practice with the kindergarten’s everyday surroundings.","A small red shrine stands beside trees with space for offerings in front. “She Kung” names a local earth deity, worshipped for the safety of the community and those coming and going.","A small red shrine stands near the entrance of Mok Hing Choi’s ancestral house. The earth deity, also called Fude Zhengshen, guards the locality and home in folk belief and receives prayers for family safety.","Facing the doorway, the right couplet reads “玉堂富貴”, the heading “鴻禧” and the left couplet “金屋榮華”. The auspicious phrases express wishes for household prosperity and blessings.","A red tablet before Mok’s ancestral house bears the words “天官賜福”, meaning blessings bestowed by the Heavenly Official. In Daoist belief, this member of the Three Officials grants blessings and receives prayers for household peace.","Facing the doorway, the right couplet reads “奉先思孝” and the left “厚德載福”. They express remembrance of ancestors, filial respect and the hope that virtue brings blessings.","A bagua mirror hangs at the centre of the lintel with a small fork-shaped object above. Such doorway objects express wishes to ward off harm and protect the home in Chinese folk belief.","Mok Hing Choi (Mok) offered incense on his birthday, 8 March, expressing wishes for blessings and peace. A red offering fixture stands at the edge of the open ground, with grass and village houses behind.","Incense sticks and traces of offerings occupy a small patch of earth beside concrete paths. The course record identifies the branches as leading towards the pier and the old fort, recording worship at a road junction."],"uncertaintyEN":["The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","The pin is a general representative location for the temple, not the exact photographed part or camera position.","Estimated from the photograph’s background and personal map interpretation, without independent street-view or image verification. The grassed area, background place names and camera position remain uncertain.","Estimated from the photograph’s background and personal map interpretation, without independent street-view or image verification. The grassed area, background place names and camera position remain uncertain.","The pin represents the monastery as a whole. The exact position of the earth deity shrine and the camera has not been independently confirmed.","The pin represents the monastery as a whole. The exact position of the open space opposite the main hall and the camera has not been independently confirmed.","The pin represents the monastery as a whole. The exact position of the main hall as a separately located building and the camera has not been independently confirmed.","The pin represents the monastery as a whole. The exact position of the spirit tablet outside the main hall and the camera has not been independently confirmed.","The pin represents the monastery as a whole. The exact position of the Buddha statue and the camera has not been independently confirmed.","The pin represents the monastery as a whole. The exact position of the inscription inside the building and the camera has not been independently confirmed.","The pin represents the recreation centre, not the altar or camera. The room temporarily housing the altar has not been located precisely.","The pin represents the recreation centre, not the stone pillar or camera. The pillar’s precise position within the grounds has not been confirmed.","The pin represents the recreation centre, not the altar or camera. The room temporarily housing the altar has not been located precisely.","The opening inscription supports identification of Tung Chung District Recreation Centre. The pin represents the centre, not the indoor figure or camera. The course record tentatively calls the deity Hau Wong; its identity is unconfirmed.","The pin represents the recreation centre, not the altar or camera. The room temporarily housing the altar has not been located precisely.","Photographic comparison supports identification as the former Lutheran church, although the course record calls it Catholic. The map pin represents the old church, not the exact photographed part or camera position.","Photographic comparison supports identification as the former Lutheran church, although the course record calls it Catholic. The map pin represents the old church, not the exact photographed part or camera position.","The pin represents the building, not the precise photographed part or camera position.","The pin represents the building. Neither the exact kindergarten entrance nor the camera position has been independently located.","Identification as the former Our Lady Kindergarten is inferred from the course description and the history of the premises. The pin represents the building; the statue’s precise garden position is unconfirmed.","The photograph matches publicly available images of Sham Shek She. The coordinate represents nearby Sham Shek Pavilion, not the shrine or camera position.","The ancestral house may have been in Wong Nai Uk, but its address and the precise photographed position remain unconfirmed. This record remains unmapped.","The ancestral house may have been in Wong Nai Uk, but its address and the precise photographed position remain unconfirmed. This record remains unmapped.","The ancestral house may have been in Wong Nai Uk, but its address and the precise photographed position remain unconfirmed. This record remains unmapped.","The ancestral house may have been in Wong Nai Uk, but its address and the precise photographed position remain unconfirmed. This record remains unmapped.","The ancestral house may have been in Wong Nai Uk, but its address and the precise photographed position remain unconfirmed. This record remains unmapped.","The course record names Tai Wai Hang. The coordinate represents the village only; the house and the open space in front of it have not been located precisely.","The course record does not identify the junction, and the photograph lacks sufficient identifiable landmarks. The fork and worship location remain unmapped."],"siteEN":{"侯王廟及對面草地":"Hau Wong Temple and opposite grassed area","羅漢寺":"Lo Hon Monastery","東涌區康樂中心":"Tung Chung District Recreation Centre","東涌舊教堂":"Old Tung Chung church","舊聖母幼稚園":"Former Our Lady Kindergarten","深石村一帶":"Sham Shek Tsuen area","大圍坑村一帶":"Tai Wai Hang area","地點未確認":"Place unconfirmed"},"subjectEN":{"神像與神位":"Deity figures and spirit tablets","日常活動與留影":"Everyday activities and portraits","碑刻與題字":"Inscriptions and calligraphy","辟邪物件":"Protective objects","祭祀場所與活動":"Places and practices of worship","宗教及教育建築":"Religious and educational buildings"},"descriptionsZH":["1992年1月，廟前仍是一片開闊空地，後方可見樹木與山坡。低矮瓦頂和兩側樹蔭保留了當時村落祭祀空間的環境。","木門敞開，一人正進入廟內，兩旁貼有紅紙對聯。門邊的花卉和香爐呈現了拜祭與日常出入相連的場景。","紅色門扇繪有門神，兩側對聯表達護佑與祈福的心願。課程記錄提到當時有人在廟內還神。","廟前的泥地延伸至門口，屋頂兩側有樹木相伴。尚未密集建設的戶外環境，為居民停留與活動留下空間。","樹幹與枝葉掩映牆身，屋簷下可見通風開口。廟後的樹蔭和空地，展現祭祀建築周邊的日常環境。","白色山牆與瓦頂從空地另一端露出，旁邊長有大樹。側向取景呈現屋身的長度及建築與樹木的距離。","神龕前設有供奉物，紅色題字與裝飾圍繞供奉位置。牆面、神龕和供桌共同構成室內的祭祀空間。","香爐、燭具與供奉物排列在桌上，後方設有神像與紅色帷飾。層疊的陳設呈現信眾上香、供奉的場所。","紅色供桌靠近神龕，周圍擺有多組祭祀陳設。牆上的題字與供奉物，反映同一室內空間中的不同信仰元素。","多張供桌沿牆排列，神像、香爐和題字分布其間。較寬的畫面呈現祭祀物件在室內的布局。","1991年12月至1992年1月期間，一名同學在草地上張開雙臂，面向鏡頭玩耍。遠處可見水面與山體，背景疑為赤鱲角。","1991年12月至1992年1月期間，三名同學在開闊地上玩耍，留下田野活動間隙的輕鬆時刻。遠處山坡疑為牛凹一帶。","紅色小神龕嵌在牆腳附近，將祭祀融入日常經過的地方。土地神是民間信仰中的地方守護神，人們向其祈求居處平安。","一人站在欄杆前留影，背後是山坡與開闊天空。鋪砌地面與欄杆構成寺院外可停留、活動的空間。","柱列、門窗與屋簷形成整齊的正面，門前留有活動空間。殿內供奉佛像，是寺院禮佛和宗教活動的場所。","白色牌位與香爐設在牆邊，題字為「十方界無主孤魂等眾之位」。它為沒有固定祭祀者的亡靈設置供養位置，表達普施與追薦的心意。","中央坐佛前擺有花瓶、香爐與供奉物，周圍另有較小造像。主像與供桌的組合構成禮佛的中心。","深色碑面以金字記述寺院的創建沿革。這類碑記保存建寺與地方信仰的文字記憶。","多尊造像與香爐同置於供台，後方是簡單的室內牆面。課程以「媽娘」稱呼其中的神像，呈現當地對天后的稱謂。","草地上的直立石柱刻有「南無阿彌陀佛」，四周有樹木圍繞。課程將它記為石敢當，這類石刻在民間常有護佑、辟邪的寓意。","中央神像兩旁另有較小造像，前方擺有香爐與供奉物。課程記錄提到神像由別處搬來，反映搬遷期間仍延續的供奉活動。","神像陳列在藍色牆面前，兩側與上方掛有書法題字。這些陳設將宗教供奉與場所的開幕誌慶結合。","中央神像身披彩色服飾，兩旁造像與前方香枝排列密集。供台上的香爐和供物，保留了當時的拜祭場景。","低矮牆身、窗戶與周邊樹木同時入鏡，建築外觀簡樸。課程把這處記為黃泥屋附近一座當時已停用的教堂。","一排窗戶沿低矮牆身展開，近處有草地與樹蔭。1992年的鏡頭記錄了建築背後與村落植被相接的環境。","低矮建築前設有圍欄與空地，後方緊接山坡。這座建築於1971年作診所啟用，後改為幼稚園，再成為聖母訪親小堂。","入口附近的柱廊與植被形成遮蔭通道，門前空間連接室內與花園。這條進出路徑也呈現了教育場所與戶外環境的關係。","白色聖母像安置在綠植環繞的小型聖龕內。花園中的宗教造像，讓信仰實踐與幼稚園的日常環境相連。","紅色小祠設在樹旁，前方留有供奉空間。「社公」是地方土地神的稱呼，居民藉祭祀祈求社區與出入平安。","莫興財（莫伯）的祖屋牆邊設有紅色小神龕，供奉位置貼近出入口。土地神亦稱福德正神，是地方與家宅的守護神，人們向其祈求家人平安。","面向門口，右聯為「玉堂富貴」，橫批為「鴻禧」，左聯為「金屋榮華」。這些吉語寄託家宅興旺、福慶臨門的願望。","紅色神位寫有「天官賜福」，設在莫伯祖屋門前。道教三官信仰中，天官掌賜福，人們藉供奉祈求吉祥與家宅平安。","面向門口，右聯為「奉先思孝」，左聯為「厚德載福」。兩聯寄託追念祖先、重視孝道，以及以德承福的祝願。","八卦鏡懸在門楣中央，上方設有小叉狀物。八卦與鐵叉同屬中國民間的門戶辟邪物，寄託驅邪、守護家宅的心願。","莫興財（莫伯）在3月8日生日上香，祈求平安與福氣。空地邊緣設有紅色供奉設施，後方可見草地與村屋。","香枝與供奉痕跡集中在水泥路邊的一小片泥地。課程記錄指出，兩邊分別通往碼頭與古堡炮台，呈現道路交會處的拜祭活動。"],"uncertaintyZH":{"30":"祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。","31":"祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。","32":"祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。","33":"祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。","34":"祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。"}};

istrict Recreation Centre.","東涌區康樂中心內的神像及開幕誌慶書法":"Deity statue and calligraphy commemorating the opening of Tung Chung District Recreation Centre, inside the centre.","參考照片中「東涌區康樂中心開幕誌慶」字樣，採用中心概略代表座標，並非室內神像或拍攝者的精確位置；神像於課程資料中疑記為侯王，身分未確認。":"The opening inscription supports identification of Tung Chung District Recreation Centre. The pin represents the centre, not the indoor figure or camera. The course record tentatively calls the deity Hau Wong; its identity is unconfirmed.","東涌舊教堂側面（後復修為道恩堂／道恩青年營）":"Side of the old Tung Chung church, later restored as Tao En Church / Tao En Youth Camp.","照片對照支持為信義會舊堂，課程資料記為天主教堂。採用舊教堂地圖標記作代表座標，並非各照片被攝部分或拍攝者的精確位置。":"Photographic comparison supports identification as the former Lutheran church, although the course record calls it Catholic. The map pin represents the old church, not the exact photographed part or camera position.","東涌舊教堂背面（後復修為道恩堂／道恩青年營）":"Rear of the old Tung Chung church, later restored as Tao En Church / Tao En Youth Camp.","東涌聖母幼稚園外貌（現為東涌聖母訪親小堂）":"Exterior of Our Lady Kindergarten, Tung Chung, now Our Lady of Visitation Chapel.","採用建築概略代表座標，並非照片被攝部分或拍攝者的精確位置。":"The pin represents the building, not the precise photographed part or camera position.","東涌聖母幼稚園入口（現為東涌聖母訪親小堂）":"Entrance of Our Lady Kindergarten, Tung Chung, now Our Lady of Visitation Chapel.","採用建築概略代表座標，並非幼稚園入口或拍攝者的精確位置。":"The pin represents the building. Neither the exact kindergarten entrance nor the camera position has been independently located.","東涌聖母幼稚園花園內的聖母像（現為東涌聖母訪親小堂）":"Marian statue in the garden of Our Lady Kindergarten, Tung Chung, now Our Lady of Visitation Chapel.","根據課程資料「東涌幼稚園內」及校址歷史，推定為舊聖母幼稚園；採用建築概略代表座標，聖母像在園內的具體位置未確認。":"Identification as the former Our Lady Kindergarten is inferred from the course description and the history of the premises. The pin represents the building; the statue’s precise garden position is unconfirmed.","深石村「深石社」社公神位":"Sham Shek She earth deity shrine in Sham Shek Village.","照片與深石社神位的公開照片相符。採用附近深石亭的代表座標，並非神位或拍攝者的精確位置。":"The photograph matches publicly available images of Sham Shek She. The coordinate represents nearby Sham Shek Pavilion, not the shrine or camera position.","莫興財（莫伯）祖屋前土地神位":"Earth deity shrine in front of Mok Hing Choi’s (Uncle Mok’s) ancestral house.","祖屋疑位於黃泥屋村。課程報告中化名 Kwan Hing Kee 的長者，其居住及祖屋祭祀情況與照片資料相近，但人物身分及具體屋址未確認，暫不定位。":"The house may have been in Wong Nai Uk Village. The living arrangements and ancestral-house worship of an elder given the pseudonym Kwan Hing Kee in the course report resemble the photographic records, but the person’s identity and exact address remain unconfirmed. The record is therefore left unmapped.","莫伯祖屋前對聯":"Couplets in front of Uncle Mok’s ancestral house.","莫伯祖屋門前天官賜福神位":"Tianguan blessing tablet outside the entrance of Uncle Mok’s ancestral house.","莫伯叔伯輩祖屋門前對聯":"Couplets outside the ancestral house of Uncle Mok’s older male relatives.","叔伯租屋疑位於黃泥屋村。課程報告中化名 Kwan Hing Kee 的長者，其居住及祖屋祭祀情況與照片資料相近，但人物身分及具體屋址未確認，暫不定位。":"The house may have been in Wong Nai Uk Village. The living arrangements and ancestral-house worship of an elder given the pseudonym Kwan Hing Kee in the course report resemble the photographic records, but the person’s identity and exact address remain unconfirmed. The record is therefore left unmapped.","莫伯叔伯輩祖屋之三叉八卦（補影）":"Trident and bagua at the ancestral house of Uncle Mok’s older male relatives (additional photograph).","大圍坑村莫伯門前空地":"Open space in front of Uncle Mok’s home in Tai Wai Hang Village.","課程資料記載為大圍坑村；座標僅代表村落大概位置，莫伯住所及門前空地的具體位置未確認。":"The course record names Tai Wai Hang. The coordinate represents the village only; the house and the open space in front of it have not been located precisely.","往碼頭與古堡炮台的分岔路旁拜祭":"Worship beside the fork leading to the pier and the old fort battery.","課程資料未註明具體路口，照片亦缺乏可辨識地標，未能確認分岔路及拜祭位置。":"The course record does not identify the junction, and the photograph lacks sufficient identifiable landmarks. The fork and worship location remain unmapped.","課程資料":"Course material","Yoys、環境保護署":"Yoys; Environmental Protection Department","環境保護署、康樂及文化事務署（地圖判讀估算）":"Environmental Protection Department; Leisure and Cultural Services Department (estimated through map interpretation)","依現代 OpenStreetMap 底圖概略描繪；部分邊界受地名標籤遮擋，並非實測或1992年的建築範圍。":"Traced approximately from the modern OpenStreetMap basemap. Some boundaries are obscured by place labels; this is neither a survey nor a record of the building extent in 1992.","依現代OpenStreetMap底圖概略描繪，不代表1992年的建築範圍；照片中的入口及神像位置未獨立確認。":"Traced approximately from the modern OpenStreetMap basemap; it does not represent the building extent in 1992. The entrance and statue positions in the photographs have not been independently confirmed.","依現代OpenStreetMap底圖概略描繪道路中心線，供辨認侯王廟周邊位置；未確認1982或1992年走向，不代表照片中可見道路或拍攝者行走路線。":"The road centreline was traced approximately from the modern OpenStreetMap basemap to help identify the surroundings of Hau Wong Temple. Its alignment in 1982 or 1992 was not confirmed in this original note; it does not represent a road visible in the photographs or the photographer’s route.","依現代OpenStreetMap底圖概略描繪東涌道路段中心線，供辨認小堂周邊位置，非實測；未確認1992年走向，不代表拍攝者行走路線。":"The centreline of this section of Tung Chung Road was traced approximately from the modern OpenStreetMap basemap to help identify the chapel’s surroundings. It is not surveyed. Its 1992 alignment was not confirmed in this original note, and it does not represent the photographer’s route.","依現代OpenStreetMap底圖概略描繪可辨識支路，非實測；未確認1992年走向，不代表拍攝者行走路線。":"The identifiable branch road was traced approximately from the modern OpenStreetMap basemap. It is not surveyed. Its 1992 alignment was not confirmed in this original note, and it does not represent the photographer’s route."};

function contextBackground(f){var road=f.geometry.type==='LineString',hau=String(f.properties.fid)==='1';if(road)return hau?T('這段路連結侯王橋、東澳古道與沙咀頭侯王廟周邊，協助理解廟宇與附近村落的交通關係。對照1982年影像與現代底圖，所繪路段的走向沒有明顯變化。','This route links Hau Wong Bridge, Tung O Trail and the surroundings of Hau Wong Temple at Sha Tsui Tau, helping relate the temple to nearby villages. Comparing the 1982 imagery with the modern map shows no evident change in the alignment of the traced section.'):T('這段東涌道連結上嶺皮與灰窰下，並經大路旁的小岔道通往舊聖母幼稚園後來改作的聖母訪親小堂；小堂供東涌一帶教友舉行平日彌撒與社區活動。對照1982年影像與現代底圖，所繪路段的走向沒有明顯變化。','This section of Tung Chung Road connects Sheung Ling Pei and Fui Yiu Ha, with a small branch from the main road leading to the former kindergarten, later Our Lady of Visitation Chapel. The chapel hosts weekday Mass and community activities; comparison of the 1982 imagery and modern map shows no evident change in the traced route’s alignment.');return hau?T('侯王廟位於東涌沙咀頭，廟前的開闊地與樹木亦出現在這組照片中。廟內保存鑄有1765年紀年的古鐘，建築於2010年獲評為二級歷史建築。','Hau Wong Temple stands at Sha Tsui Tau, Tung Chung, beside the open ground and trees seen in this group of photographs. It retains a bell dated 1765 and was graded as a Grade 2 historic building in 2010.'):T('這座建築位於東涌上嶺皮村，最初於1971年作診所啟用，後改為幼稚園，1999年起作彌撒中心，2000年命名為聖母訪親小堂。對照1982年影像與現代底圖，這座建築的外部輪廓沒有明顯變化。','The building stands in Sheung Ling Pei, Tung Chung. It opened as a clinic in 1971, later became a kindergarten, was used as a Mass centre from 1999 and was named Our Lady of Visitation Chapel in 2000; comparison of the 1982 imagery and modern map shows no evident change in its external outline.');}

function methodHtml(){return '<p>'+T('本網站整理Box B16全部36張照片，連結照片、metadata與地方背景。30筆有代表位置；6筆未定位記錄仍完整保留在清單。','This archive includes all 36 photographs in Box B16, linking images, metadata and place context. Thirty records have representative locations; six unmapped records remain available in the list.')+'</p><h3>'+T('如何閱讀地圖','Reading the map')+'</h3><p>'+T('數字圓圈表示照片聚合；點擊可放大，重疊照片會展開。展開時符號以細線連回共用位置，排列不表示推估距離或實際拍攝位置。','Numbered circles group photographs. Click to zoom or expand overlapping photos. Fine lines connect expanded symbols to a shared location; their layout does not show estimated distance or the camera position.')+'</p>'+Object.keys(terms).map(function(k){return '<h4>'+termHeading(k)+'</h4><div>'+termHtml(k)+'</div>';}).join('')+'<h3>'+T('不同年代的資料','Sources from different dates')+'</h3><p>'+T('有日期的照片涵蓋1991~1992年；缺日期者保留未記錄。1982航空影像與2026現代底圖用於比較環境。道路走向與舊幼稚園外部輪廓的年代比較由整理者提供；輪廓並非實測邊界。','Dated photographs span 1991~1992; missing dates remain unrecorded. The 1982 imagery and 2026 map provide environmental comparison. The compiler supplied comparisons of route alignment and the former kindergarten’s external outline across dates; outlines are not surveyed boundaries.')+'</p><h3>'+T('資料、翻譯與不確定性','Data, translation and uncertainty')+'</h3><p>'+T('照片與原始描述來自課程Box B16資料。照片說明、定位依據及原始中文記錄均可閱讀。英文是閱讀輔助，未確認的身分、位置和日期不因翻譯而變成確定事實；莫興財譯作Mok Hing Choi，屬編輯採用的香港粵語拼寫，並非已核實的本人英文姓名。','Photographs and original descriptions come from the course’s Box B16 material. Records retain descriptions, location rationale and original Chinese notes. English is a reading aid: uncertain identities, locations and dates remain uncertain. Mok Hing Choi is an editorial Cantonese romanisation, not a verified personal English name.')+'</p><p>'+T('點、線、面是GIS表達位置與範圍的基本幾何形式；本網站用它們協助閱讀歷史照片，並不把這三種形式宣稱為一套特定遺產評級方法。','Points, lines and polygons are basic GIS geometries for locations and extents. This archive uses them to interpret photographs; it does not present them as a particular heritage-grading framework.')+'</p><d
