ancestral house of Mok Hing Choi’s older relatives", "Trident and bagua symbol", "Open space outside Mok Hing Choi’s home, Tai Wai Hang", "Roadside Worship Opposite Mok Hing Choi’s Home"]}, "descriptionsEN": ["Hau Wong Temple stands in Sha Tsui Tau, Tung Chung. Built around the thirtieth year of the Qianlong reign (1765), it is a Grade 2 historic building with a two-hall layout, dedicated to Yeung Hau Wong. When the photograph was taken in 1992, the forecourt was still unpaved earth. The area in front of the temple lay close to the shore of Tung Chung Bay.", "Hau Wong Temple stands in Sha Tsui Tau, Tung Chung. Built around the thirtieth year of the Qianlong reign (1765), it is dedicated to Yeung Hau Wong. The pair of civil-official door gods draws on the figures of Qin Shubao and Yuchi Gong. Also known as blessing door gods, they guard the entrance and ward off evil, while expressing wishes for advancement, good fortune, longevity and a harmonious household.", "Hau Wong Temple stands in Sha Tsui Tau, Tung Chung. Built around the thirtieth year of the Qianlong reign (1765), it is dedicated to Yeung Hau Wong. The pair of civil-official door gods draws on the figures of Qin Shubao and Yuchi Gong. Also known as blessing door gods, they guard the entrance and ward off evil, while expressing wishes for advancement, good fortune, longevity and a harmonious household.", "Hau Wong Temple stands in Sha Tsui Tau, Tung Chung. Built around the thirtieth year of the Qianlong reign (1765), it is a Grade 2 historic building with a two-hall layout, dedicated to Yeung Hau Wong. When the photograph was taken in 1992, the forecourt was still unpaved earth. The area in front of the temple lay close to the shore of Tung Chung Bay.", "Hau Wong Temple stands in Sha Tsui Tau, Tung Chung. Built around the thirtieth year of the Qianlong reign (1765), it is a Grade 2 historic building dedicated to Yeung Hau Wong. Tung Chung Hau Wong Temple Children’s Playground, visible behind the temple, remains on the same site.", "Hau Wong Temple stands in Sha Tsui Tau, Tung Chung. Built around the thirtieth year of the Qianlong reign (1765), it is a Grade 2 historic building with a two-hall layout, dedicated to Yeung Hau Wong. When the photograph was taken in 1992, the ground on the temple’s right side was still unpaved earth, preserving a view of the surroundings before later alterations.", "Hau Wong Temple in Sha Tsui Tau, Tung Chung, was built around 1765 and is a Grade 2 historic building. It has a two-hall layout, with side halls flanking the central main hall. The western hall contains a shrine to Choi Pak Sing Kwan, also known as the Wealth God Who Brings Blessings. Worshippers pray to this deity for prosperity and a secure livelihood.", "Hau Wong Temple in Sha Tsui Tau, Tung Chung, was built around 1765 and is a Grade 2 historic building. The central hall is dedicated to Yeung Hau Wong, traditionally identified as Yeung Leung-jit, who escorted the Song emperors on their flight south. Regarded as a guardian of residents, fishermen and soldiers, Hau Wong is worshipped for peace, protection from misfortune and the warding off of evil.", "Hau Wong Temple in Sha Tsui Tau, Tung Chung, was built around 1765 and is a Grade 2 historic building. The temple has a two-hall layout and is dedicated to Yeung Hau Wong. Its eastern hall honours the founding ancestors, continuing villagers’ remembrance and veneration of earlier generations.", "Hau Wong Temple in Sha Tsui Tau, Tung Chung, was built around 1765 and is a Grade 2 historic building. The temple has a two-hall layout and is dedicated to Yeung Hau Wong. Its eastern hall honours the founding ancestors, continuing villagers’ remembrance and veneration of earlier generations.", "In 1991, the Departments of Anthropology and History at the Chinese University of Hong Kong began the Tung Chung Research Project. The person pictured was probably a student taking part in the project. The site is opposite Hau Wong Temple, and the background may be Chek Lap Kok. Work on the new airport had just begun, and the airport was not yet complete.", "In 1991, the Departments of Anthropology and History at the Chinese University of Hong Kong began the Tung Chung Research Project. The three people pictured were probably students taking part in the project. The site is opposite Hau Wong Temple, and the background may be the Ngau Au area. Work on the new airport had just begun, and the airport was not yet complete.", "Lo Hon Monastery stands on the hillside behind Shek Mun Kap Village in Tung Chung, with an earth deity shrine beside it. The earth deity, also known as Fude Zhengshen, is regarded as the guardian of a locality. People offer incense for peace in the community and safety at home; residents who once farmed also prayed for favourable weather and plentiful harvests.", "In 1991, the Departments of Anthropology and History at the Chinese University of Hong Kong began the Tung Chung Research Project. The person pictured was probably a student taking part, standing in what appears to be the open space opposite the Mahavira Hall. The monastery stands behind Shek Mun Kap Village. It grew from Lo Hon Ngam, a natural cave where Master Cheung Yuen began his retreat in 1926, and held its opening and consecration ceremony in 1974.", "Lo Hon Monastery stands on the hillside behind Shek Mun Kap Village in Tung Chung. Its principal building, the Mahavira Hall, had its foundation stone laid on 3 May 1971 and was inaugurated and consecrated in 1974. The hall houses three gilded images of Shakyamuni Buddha, Amitabha Buddha and Medicine Buddha, where worshippers pay their respects and pray for blessings.", "Lo Hon Monastery stands on the hillside behind Shek Mun Kap Village in Tung Chung. A spirit tablet outside the Mahavira Hall is dedicated to unclaimed wandering souls throughout the ten directions, providing a place for offerings to the dead who have no regular worshippers. The monastery grew from a natural cave where Master Cheung Yuen began his retreat in 1926, and held its opening and consecration ceremony in 1974.", "Lo Hon Monastery stands on the hillside behind Shek Mun Kap Village in Tung Chung. Its Mahavira Hall houses three gilded images of Shakyamuni Buddha, Amitabha Buddha and Medicine Buddha. Shakyamuni is the founder of Buddhism; Amitabha is associated with the Western Pure Land; and Medicine Buddha is connected with prayers for healing, freedom from misfortune and well-being.", "The inscription on the founding of Lo Hon Monastery, inside the Mahavira Hall, records the monastery’s construction. In the mid-1960s, the lay Buddhist Lee Yiu-ting visited with friends and resolved to build a monastery here. The inscription describes his vow to establish a Buddhist temple. He died before the work was complete, and his children, relatives and friends carried it forward. The hall’s foundation stone was laid on 3 May 1971, and its opening and consecration ceremony was held in 1974.", "Tung Chung District Recreation Centre is in the Ngau Au Village area. In 1991–1992, it temporarily housed images of Tin Hau relocated from Chek Lap Kok’s Tin Hau Temple. Tin Hau, also known as Mazu, is the guardian of fishermen and seafarers, who pray to her for safety at sea. Chek Lap Kok was cleared for the new airport, and the villagers brought the images back to the temple after its reconstruction at Wong Lung Hang in 1994.", "Tung Chung District Recreation Centre is in the Ngau Au Village area, near Hau Wong Temple at Sha Tsui Tau. A nearby stone pillar is inscribed with the six Chinese characters “Namo Amitabha Buddha” and is also known as a shigandang. These traditional protective stones are often placed at road junctions, beside bridges or near homes to ward off harmful influences and safeguard households and travellers.", "Tung Chung District Recreation Centre is in the Ngau Au Village area. In 1991–1992, it temporarily housed images of Tin Hau relocated from Chek Lap Kok’s Tin Hau Temple. Tin Hau, also known as Mazu, is the guardian of fishermen and seafarers, who pray to her for safety at sea. Chek Lap Kok was cleared for the new airport, and the villagers brought the images back to the temple after its reconstruction at Wong Lung Hang in 1994.", "Tung Chung District Recreation Centre is in the Ngau Au Village area, near Hau Wong Temple at Sha Tsui Tau. In 1991, Chek Lap Kok Village was relocated for the construction of the new airport, and Tin Hau Temple was dismantled for preservation. Its images of Tin Hau and associated ritual objects were temporarily housed at the centre so that villagers could continue their worship. The calligraphy on the walls was written to commemorate the centre’s opening.", "Tung Chung District Recreation Centre is in the Ngau Au Village area. In 1991–1992, it temporarily housed images of Tin Hau relocated from Chek Lap Kok’s Tin Hau Temple. Tin Hau, also known as Mazu, is the guardian of fishermen and seafarers, who pray to her for safety at sea. Chek Lap Kok was cleared for the new airport, and the villagers brought the images back to the temple after its reconstruction at Wong Lung Hang in 1994.", "The old church in Wong Nai Uk Village was originally Tung Chung Chapel, founded in 1960 by the Nordic Christian Mission to Buddhists. Near the mouth of the Tung Chung River, missionaries offered free schooling and interest classes for fishing families alongside their religious work. Villagers called it the “Jesus Church”. The church was no longer in use when this photograph was taken in 1992. Following restoration, it reopened in January 2008 as Tao Yan Church.", "The old church in Wong Nai Uk Village was originally Tung Chung Chapel, founded in 1960 by the Nordic Christian Mission to Buddhists. The Evangelical Lutheran Church of Hong Kong took over in the 1980s, and the premises later became Tung Chung Youth Camp. Poor transport connections and low attendance led to the camp’s closure. Following restoration, the church reopened in January 2008 as Tao Yan Church, also providing camp services under the name Tao Yan Youth Camp.", "The former Our Lady Kindergarten stands at 13 Sheung Ling Pei Village, Tung Chung. The building opened as a clinic in 1971 and later became a kindergarten, providing preschool education for local children. It was still used as a kindergarten when this photograph was taken in 1992. The premises were later adapted for religious use and formally named Our Lady of Visitation Chapel in January 2000.", "The former Our Lady Kindergarten stands at 13 Sheung Ling Pei Village, Tung Chung. The contemporary fieldwork report records just one teacher and four pupils, with nuns visiting weekly. As Tung Chung New Town developed, the school later moved to Yat Tung Estate and became Tung Chung Catholic Kindergarten, continuing its work in Catholic early childhood education.", "The former Our Lady Kindergarten stands at 13 Sheung Ling Pei Village, Tung Chung, and contains a statue of the Virgin Mary. Mary is the mother of Jesus and is venerated in the Catholic faith; believers ask for her intercession. The former school premises later became Our Lady of Visitation Chapel, continuing their religious use.", "Sham Shek She stands beside the Tung O Ancient Trail on the northern coast of Lantau Island. It is dedicated to the local earth deity, known to villagers as She Kung, who is worshipped for peace at home, safety on journeys and plentiful harvests. Nearby Sham Shek Pavilion was built in 1971 by Shum Shui-chun in memory of their mother. It also offers villagers and hikers a place to rest and shelter from sun and rain.", "An earth deity shrine stands outside the ancestral house of Mok Hing Choi, known as Uncle Mok, where family members offer incense in daily worship. The earth deity, also known as Fude Zhengshen, guards the locality and the household. Worshippers pray for a secure home, their family’s well-being, a comfortable life and a steady livelihood.", "The couplets outside Uncle Mok’s ancestral house read “Wealth and Honour in the Jade Hall” and “Splendour and Prosperity in the Golden House”, with “Abundant Blessings” above the entrance. “Jade hall” and “golden house” are flattering names for a home; together, these auspicious phrases express wishes for a flourishing household and good fortune.", "A tablet inscribed “The Heavenly Official Bestows Blessings” is housed in a red wooden shrine mounted high on the outside wall beside the entrance to Uncle Mok’s ancestral house. The Heavenly Official is one of the Three Officials in Taoism and is responsible for bestowing blessings. Worshippers seek good fortune and peace for their household.", "The couplets outside the ancestral house of Uncle Mok’s older male relatives read “Honour the Ancestors and Remember Filial Duty” and “Great Virtue Bears Blessings”. They express respect for ancestors, the importance of filial devotion, and the hope that a family’s virtue will sustain its good fortune.", "Bagua mirrors hang above the doorways of the ancestral houses of Uncle Mok and his older male relatives, each with a small trident mounted above it. These are common protective objects in folk belief, placed at entrances to ward off harmful influences and safeguard the home and family.", "Uncle Mok’s home was in Tai Wai Hang Village, Tung Chung. The original note states that 8 March was his birthday and that he offered incense outside the entrance that day. This may have been a birthday observance expressing wishes for health, peace, blessings and longevity, but the specific ritual was not recorded.", "This roadside worship site was recorded during the Tung Chung fieldwork. The original note states that the two branches of the fork led towards the pier and the old fort and battery. Traces of incense offerings and worship remained beside the path. Its precise location, the object of worship and the ritual performed have not been confirmed."], "uncertaintyEN": ["The pin is a general repre 育建築": "Religious and educational buildings"}, "descriptionsZH": ["侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築。廟宇採兩進式布局，主祀楊侯王。1992年拍攝時，廟前尚未鋪設水泥，仍是一片泥地，廟前一帶靠近東涌灣海岸。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），主祀楊侯王。廟門上的一對文官門神沿用秦叔寶與尉遲恭的形象，亦稱「祈福門神」，除了守門辟邪，也寄託升官、添福添壽與家宅和順的願望。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），主祀楊侯王。廟門上的一對文官門神沿用秦叔寶與尉遲恭的形象，亦稱「祈福門神」，除了守門辟邪，也寄託升官、添福添壽與家宅和順的願望。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築。廟宇採兩進式布局，主祀楊侯王。1992年拍攝時，廟前尚未鋪設水泥，仍是一片泥地，廟前一帶靠近東涌灣海岸。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築，主祀楊侯王。廟後拍攝到的是東涌侯王廟兒童遊樂場，至今仍保留在原址。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築。廟宇採兩進式布局，主祀楊侯王。1992年拍攝時，廟宇右側尚未鋪設水泥，仍是一片泥地，保留了改建前的環境。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築。廟宇採兩進式布局，中央主殿兩旁設有側堂。西堂設有財帛星君神龕，財帛星君又稱「增福財神」，掌管財祿，善信向祂祈求財運與生活富足。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築。中廳主祀楊侯王，相傳他是南宋末年護送宋帝南逃的楊亮節。侯王被視為居民、漁民及軍士的守護神，人們向祂祈求平安、消災與辟邪。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築。廟宇採兩進式布局，主祀楊侯王，東堂則供奉建廟祖先，延續村民對先人的敬奉與紀念。", "侯王廟位於東涌沙咀頭，約建於清乾隆三十年（1765年），為二級歷史建築。廟宇採兩進式布局，主祀楊侯王，東堂則供奉建廟祖先，延續村民對先人的敬奉與紀念。", "1991年，香港中文大學人類學系與歷史系開展東涌研究計劃。照片中的人物應為參與計劃的一位同學，此地在侯王廟對面，背景疑為赤鱲角。當時新機場工程剛展開，機場尚未落成。", "1991年，香港中文大學人類學系與歷史系開展東涌研究計劃。照片中的人物應為參與計劃的三位同學，此地在侯王廟對面，背景疑為牛凹一帶。當時新機場工程剛展開，機場尚未落成。", "羅漢寺位於東涌石門甲村後山，寺旁設有土地神位。土地神又稱福德正神，是一方土地的守護神，人們向祂上香，祈求地方安寧、家宅平安；昔日務農的居民亦會祈求風調雨順、農作豐收。", "1991年，香港中文大學人類學系與歷史系開展東涌研究計劃。照片中的人物應為參與計劃的一位同學，留影地點應為大雄寶殿對面的空地。寺院位於石門甲村後山，起源於暢緣法師自1926年起潛修的天然岩洞「羅漢巖」，後來逐步興建，於1974年舉行落成開光典禮。", "羅漢寺位於東涌石門甲村後山，大雄寶殿是寺院的主體建築，於1971年5月3日奠基，1974年舉行落成開光典禮。殿內供奉釋迦牟尼佛、阿彌陀佛及藥師佛三尊金身佛像，供善信禮佛祈福。", "羅漢寺位於東涌石門甲村後山，大雄寶殿門外設有「十方界無主孤魂等眾之位」神位，供養沒有固定祭祀者的亡靈，寄託普施與追薦的心意。寺院起源於暢緣法師自1926年起潛修的天然岩洞，後來逐步興建，於1974年舉行落成開光典禮。", "羅漢寺位於東涌石門甲村後山，大雄寶殿內供奉釋迦牟尼佛、阿彌陀佛及藥師佛三尊金身佛像。釋迦牟尼佛是佛教的創始者；阿彌陀佛與西方極樂世界的信仰相關；藥師佛則與消災、療疾及身心安穩的祈願相關。", "羅漢寺大雄寶殿內的《創建羅漢寺碑記》記錄了寺院的興建經過。1960年代中，李耀庭居士與友人到訪後，決意在此建寺，碑記記下他「首發大願興建佛寺」。李居士在工程完成前去世，由子女及親友承接其遺願，繼續興建。大雄寶殿於1971年5月3日奠基，1974年舉行落成開光典禮。", "東涌區康樂中心位於牛凹村一帶，1991至1992年間曾暫奉從赤鱲角天后宮遷來的天后神像。天后又稱媽祖，是漁民與航海者的守護神，人們向她祈求海上平安。當時赤鱲角因興建新機場而搬遷，直至1994年天后宮在黃龍坑重建完成，村民才將神像迎回廟內。", "東涌區康樂中心位於牛凹村一帶，鄰近沙咀頭侯王廟。中心附近有一根刻着「南無阿彌陀佛」六字的石柱，亦被稱為「石敢當」。這種民間常見的鎮煞石刻，多設於道路交會處、橋旁或住宅附近，人們藉此祈求辟邪護宅、出入平安。", "東涌區康樂中心位於牛凹村一帶，1991至1992年間曾暫奉從赤鱲角天后宮遷來的天后神像。天后又稱媽祖，是漁民與航海者的守護神，人們向她祈求海上平安。當時赤鱲角因興建新機場而搬遷，直至1994年天后宮在黃龍坑重建完成，村民才將神像迎回廟內。", "東涌區康樂中心位於牛凹村一帶，鄰近沙咀頭侯王廟。1991年，赤鱲角村因興建新機場而搬遷，天后宮亦被拆件保存，裡面的天后神像及相關祭祀物件則暫置於康樂中心，供村民繼續奉祀。牆上的書法則是為中心開幕誌慶而題寫。", "東涌區康樂中心位於牛凹村一帶，1991至1992年間曾暫奉從赤鱲角天后宮遷來的天后神像。天后又稱媽祖，是漁民與航海者的守護神，人們向她祈求海上平安。當時赤鱲角因興建新機場而搬遷，直至1994年天后宮在黃龍坑重建完成，村民才將神像迎回廟內。", "黃泥屋村的舊教堂前身為東涌禮拜堂，由北歐道友差會於1960年成立。教堂鄰近東涌河口，宣教士除了傳道，也為漁民開辦義學與興趣班，村民稱這裡為「耶穌堂」。1992年拍攝時，教堂已經停用。舊址經修葺後，於2008年1月復堂，命名為「道恩堂」。", "黃泥屋村的舊教堂前身為東涌禮拜堂，由北歐道友差會於1960年成立。1980年代，教堂由基督教香港信義會接手，後來改作「東涌青年營」，因交通不便、使用率偏低而停止營運。舊址經修葺後，於2008年1月復堂，命名為「道恩堂」，並以「道恩青年營」的名稱提供營地服務。", "舊聖母幼稚園位於東涌上嶺皮村13號，建築於1971年作診所啟用，後來改為幼稚園，為區內兒童提供學前教育。1992年拍攝時，校舍仍作幼稚園使用，後來改為宗教場所，於2000年1月正式命名為「聖母訪親小堂」。", "舊聖母幼稚園位於東涌上嶺皮村13號。當年的田野調查報告記載，幼稚園只有一位老師及四名學生，修女每週到訪。隨著東涌新市鎮發展，學校後來遷往逸東邨，成為東涌天主教幼稚園，繼續提供天主教幼兒教育。", "舊聖母幼稚園位於東涌上嶺皮村13號，校內設有聖母瑪利亞像。瑪利亞是耶穌的母親，在天主教信仰中受到敬禮，信眾會請求她代禱。舊校舍後來改為聖母訪親小堂，延續其宗教用途。", "深石社位於大嶼山北岸的東澳古道旁，供奉地方土地神，村民稱為「社公」，祈求家宅安寧、出入平安與農作豐收。鄰近的深石亭建於1971年，由岑瑞珍為紀念母親而建，也供往來村民與行山人士休息、遮蔭避雨。", "莫興財（莫伯）的祖屋門前設有土地神位，供家人日常上香。土地神又稱福德正神，是地方與家宅的守護神，人們向祂祈求居處安穩、家人平安，也寄託生活富足、生計順遂的願望。", "莫興財（莫伯）祖屋門前的對聯為「玉堂富貴」「金屋榮華」，橫批為「鴻禧」。「玉堂」與「金屋」都是對居所的美稱，配合富貴、榮華及福慶的吉語，寄託家宅興旺、福慶臨門的願望。", "莫興財（莫伯）祖屋門前的外牆上設有「天官賜福」神位，置於高掛的紅色木製神龕內。天官是道教「三官」之一，掌管賜福，人們藉供奉祈求迎福納祥、家宅平安。", "莫興財（莫伯）叔伯輩祖屋門前的對聯為「奉先思孝」「厚德載福」。「奉先思孝」意指敬奉祖先、不忘孝道；「厚德載福」則寄託以敦厚德行承接福澤的願望。", "莫興財（莫伯）及其叔伯輩祖屋的門楣中央均懸有八卦鏡，上方另裝有小型三叉，是民間常見的辟邪門物。人們將它們安置在入口，祈求避煞護宅、家人平安。", "莫興財（莫伯）的住所位於東涌大圍坑村。原註記提到，三月八日是他的生日，當天曾在門前上香，也許是為生辰祈福，寄託平安健康、添福添壽的願望，但具體的儀式內容並未被記錄。", "這是東涌田野調查中記錄的一處路旁拜祭地點。原註記提到，分岔路的兩邊分別通往碼頭與古堡炮台，路旁留有上香及供奉的痕跡。但具體位置、供奉對象與儀式內容尚未確認。"], "uncertaintyZH": {"30": "祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。", "31": "祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。", "32": "祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。", "33": "祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。", "34": "祖屋可能位於黃泥屋，但屋址與照片所攝位置仍未確認；本筆保留為未定位。"}};

的精確位置。":"The photograph matches publicly available images of Sham Shek She. The coordinate represents nearby Sham Shek Pavilion, not the shrine or camera position.","莫興財（莫伯）祖屋前土地神位":"Earth deity shrine in front of Mok Hing Choi’s (Uncle Mok’s) ancestral house.","祖屋疑位於黃泥屋村。課程報告中化名 Kwan Hing Kee 的長者，其居住及祖屋祭祀情況與照片資料相近，但人物身分及具體屋址未確認，暫不定位。":"The house may have been in Wong Nai Uk Village. The living arrangements and ancestral-house worship of an elder given the pseudonym Kwan Hing Kee in the course report resemble the photographic records, but the person’s identity and exact address remain unconfirmed. The record is therefore left unmapped.","莫伯祖屋前對聯":"Couplets in front of Uncle Mok’s ancestral house.","莫伯祖屋門前天官賜福神位":"Tianguan blessing tablet outside the entrance of Uncle Mok’s ancestral house.","莫伯叔伯輩祖屋門前對聯":"Couplets outside the ancestral house of Uncle Mok’s older male relatives.","叔伯租屋疑位於黃泥屋村。課程報告中化名 Kwan Hing Kee 的長者，其居住及祖屋祭祀情況與照片資料相近，但人物身分及具體屋址未確認，暫不定位。":"The house may have been in Wong Nai Uk Village. The living arrangements and ancestral-house worship of an elder given the pseudonym Kwan Hing Kee in the course report resemble the photographic records, but the person’s identity and exact address remain unconfirmed. The record is therefore left unmapped.","莫伯叔伯輩祖屋之三叉八卦（補影）":"Trident and bagua at the ancestral house of Uncle Mok’s older male relatives (additional photograph).","大圍坑村莫伯門前空地":"Open space in front of Uncle Mok’s home in Tai Wai Hang Village.","課程資料記載為大圍坑村；座標僅代表村落大概位置，莫伯住所及門前空地的具體位置未確認。":"The course record names Tai Wai Hang. The coordinate represents the village only; the house and the open space in front of it have not been located precisely.","往碼頭與古堡炮台的分岔路旁拜祭":"Worship beside the fork leading to the pier and the old fort battery.","課程資料未註明具體路口，照片亦缺乏可辨識地標，未能確認分岔路及拜祭位置。":"The course record does not identify the junction, and the photograph lacks sufficient identifiable landmarks. The fork and worship location remain unmapped.","課程資料":"Course material"," function methodHtml(){return '<p>'+T('本網站整理Box B16全部36張照片，連結照片、metadata與地方背景。30筆有代表位置；6筆未定位記錄仍完整保留在清單。','This archive includes all 36 photographs in Box B16, linking images, metadata and place context. Thirty records have representative locations; six unmapped records remain available in the list.')+'</p><h3>'+T('如何閱讀地圖','Reading the map')+'</h3><p>'+T('數字圓圈表示照片聚合；點擊可放大，重疊照片會展開。展開時符號以細線連回共用位置，排列不表示推估距離或實際拍攝位置。','Numbered circles group photographs. Click to zoom or expand overlapping photos. Fine lines connect expanded symbols to a shared location; their layout does not show estimated distance or the camera position.')+'</p>'+Object.keys(terms).map(function(k){return '<h4>'+methodHeading(k)+'</h4><div>'+termHtml(k)+'</div>';}).join('')+'<h3>'+T('不同年代的資料','Sources from different dates')+'</h3><p>'+T('有日期的照片涵蓋1991~1992年；缺日期者保留未記錄。1982航空影像與2026現代底圖用於比較環境。道路走向與舊幼稚園外部輪廓的年代比較由整理者提供；輪廓並非實測邊界。','Dated photographs span 1991~1992; missing dates remain unrecorded. The 1982 imagery and 2026 map provide environmental comparison. The compiler supplied comparisons of route alignment and the former kindergarten’s external outline across dates; outlines are not surveyed boundaries.')+'</p><h3>'+T('資料、翻譯與不確定性','Data, translation and uncertainty')+'</h3><p>'+T('照片與原始描述來自課程Box B16資料。照片說明、定位依據及原始中文記錄均可閱讀。英文是閱讀輔助，未確認的身分、位置和日期不因翻譯而變成確定事實；莫興財譯作Mok Hing Choi，屬編輯採用的香港粵語拼寫，並非已核實的本人英文姓名。','Photographs and original descriptions come from the course’s Box B16 material. Records retain descriptions, location rationale and original Chinese notes. English is a reading aid: uncertain identities, locations and dates remain uncertain. Mok Hing Choi is an editorial Cantonese romanisation, not a verified personal English name.')+'</p><p>'+T('點、線、面是GIS表達位置與範圍的基本幾何形式；本網站用它們協助閱讀歷史照片，並不把這三種形式宣稱為一套特定遺產評級方法。','Points, lines and polygons are basic GIS geometries for locations and extents. This archive uses them to interpret photographs; it does not present them as a particular heritage-grading framework.')+'</p><details><summary>'+T('資料參考','References')+'</summary><p><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://www.landsd.gov.hk/en/survey-mapping/mapping/aerial-photo-photogrammetric-products/digital-orthophoto.html" target="_blank" rel="noopener">'+T('地政總署：正射影像','Lands Department: orthophotos')+'</a></p><p>'+T('地方介紹的逐項資料來源列在各「地方故事與今昔」頁面底部。','Sources for place stories are listed at the bottom of each story page.')+'</p></details>';}
